version: "12.0"
description: Defines public requirements for process event handlers.
directives:
  - id: E-104.0
    dos:
      - Register handlers for uncaught exceptions, unhandled rejections, and warnings.
      - Preserve existing listeners on the process-like object.
    donts:
      - Do not terminate or restart the application.
    children:
      - id: E-104.0.0
        dos:
          - Accept a logger and process-like object for controlled use.
          - Remove registered handlers through the returned registration.
          - Remove registered handlers when the supplied AbortSignal aborts.
          - Report cleanup state through the removed property.
        donts:
          - Do not change options on an existing registration.
      - id: E-104.0.1
        dos:
          - Send limited error metadata to the default logger.
          - Propagate logger and listener failures to the caller.
          - Roll back handlers after a failed setup when possible.
        donts:
          - Do not expose raw event values through the default logger.
